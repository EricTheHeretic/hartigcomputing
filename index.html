<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hartig Computing</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="description" content="Hartig Computing is a wetware company. Welcome to the age of biomimetic computing." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
  <style>
    :root { --bg:#161815; --ink:#f4f1ea; --muted:#b7b2a8; --surface:#1e211e; --line:#3a3d38; --sage:#8ea584; --sage-deep:#3f5a45; --pass:#d5e0cc; --pass-bg:#243028; --fail:#f0c9cf; --fail-bg:#3a2428; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 "IBM Plex Sans", sans-serif; }
    button, a.btn { font:inherit; cursor:pointer; }
    .wrap { max-width:42rem; margin:0 auto; padding:2rem 1.25rem 3rem; }
    .splash { min-height:100dvh; display:flex; flex-direction:column; justify-content:space-between; }
    .kicker { font-family:"IBM Plex Mono", monospace; font-size:12px; letter-spacing:.04em; color:var(--muted); }
    h1 { font-size:clamp(2.6rem, 8vw, 4rem); line-height:1.02; letter-spacing:-.03em; margin:1.4rem 0 .4rem; }
    .lead { font-size:1.25rem; max-width:34rem; margin-top:0; }
    .muted { color:var(--muted); max-width:38rem; }
    .lattice { display:grid; grid-template-columns:repeat(4, 2.2rem); gap:.65rem; width:max-content; margin-top:1.5rem; }
    .lattice i { display:block; height:2.2rem; border-radius:4px; background:var(--ink); }
    .lattice i.mark { background:var(--sage-deep); }
    .btn { display:inline-flex; align-items:center; height:3rem; padding:0 1.1rem; border-radius:6px; border:1px solid var(--ink); background:var(--ink); color:var(--bg); text-decoration:none; }
    .btn.ghost { background:var(--surface); color:var(--ink); border-color:var(--line); }
    .row { display:flex; flex-wrap:wrap; gap:.5rem; margin-top:1rem; }
    .card { border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:1rem; margin-top:1rem; }
    .ok { border-color:var(--pass); background:var(--pass-bg); color:var(--pass); }
    .bad { border-color:var(--fail); background:var(--fail-bg); color:var(--fail); }
    .hidden { display:none; }
  </style>
</head>
<body>
  <main id="splash" class="wrap splash">
    <div>
      <div class="lattice" aria-hidden="true"></div>
      <h1>Hartig Computing</h1>
      <p class="lead">Welcome to the age of biomimetic computing.</p>
      <p class="muted">Hartig Computing is a wetware company.</p>
      <p class="muted">The work follows the mycorrhizal networks of the forest floor, and neuroscience.</p>
    </div>
    <p class="muted">Nothing is for sale.</p>
  </main>
  <script>
    const lattice = document.querySelector(".lattice");
    for (let i = 0; i < 16; i++) {
      const cell = document.createElement("i");
      if (i === 5 || i === 10) cell.className = "mark";
      lattice.appendChild(cell);
    }
  </script>
</body>
</html>
